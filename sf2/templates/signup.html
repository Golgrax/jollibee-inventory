{% extends "base_auth.html" %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="bg-white p-8 md:p-10 rounded-xl shadow-2xl w-full transform transition-all duration-500 ease-in-out hover:shadow-3xl">
    <div class="text-center mb-8">
        <i class="fas fa-user-plus text-6xl text-red-600"></i> {# Different icon for signup #}
        <h1 class="text-4xl font-bold text-gray-800 mt-4">Create Your Account</h1>
        <p class="text-gray-600 mt-2 text-lg">Join the Jollibee Inventory System!</p>
    </div>

    <form method="POST" class="space-y-6">
        <div class="floating-label-group">
            <input type="text" name="username" id="username"
                   class="floating-input w-full px-4 py-3 border border-gray-300 rounded-lg
                          focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent
                          transition-shadow duration-200 ease-in-out placeholder-transparent"
                   required placeholder="Username">
            <label for="username" class="floating-label">Username</label>
            <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                <i class="fas fa-user text-gray-400"></i>
            </div>
        </div>

        <div class="floating-label-group">
            <input type="password" name="password" id="password"
                   class="floating-input w-full px-4 py-3 border border-gray-300 rounded-lg
                          focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent
                          transition-shadow duration-200 ease-in-out placeholder-transparent"
                   required placeholder="Password">
            <label for="password" class="floating-label">Password</label>
            <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                <i class="fas fa-lock text-gray-400"></i>
            </div>
        </div>

        <div class="floating-label-group">
            <input type="password" name="confirm" id="confirm_password"
                   class="floating-input w-full px-4 py-3 border border-gray-300 rounded-lg
                          focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent
                          transition-shadow duration-200 ease-in-out placeholder-transparent"
                   required placeholder="Confirm Password">
            <label for="confirm_password" class="floating-label">Confirm Password</label>
            <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                <i class="fas fa-check-circle text-gray-400"></i> {# Changed icon #}
            </div>
        </div>

        <div>
            <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Role</label>
            <div class="relative">
                <select name="role" id="role"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-white
                               focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent
                               appearance-none transition-shadow duration-200 ease-in-out">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
                <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none">
                    <i class="fas fa-chevron-down text-gray-400"></i>
                </div>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row items-center justify-between mt-8 space-y-4 sm:space-y-0 sm:space-x-4">
            <a href="{{ url_for('login') }}"
               class="w-full sm:w-auto text-center font-medium text-red-600 hover:text-red-700 hover:underline
                      px-6 py-3 rounded-lg border border-red-500 hover:bg-red-50
                      transition-all duration-200 ease-in-out">
                Already have an account? Login
            </a>
            <button type="submit"
                    class="w-full sm:w-auto bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-opacity-50
                           transform hover:scale-105 transition-all duration-200 ease-in-out shadow-md hover:shadow-lg">
                <i class="fas fa-user-plus mr-2"></i> Sign Up
            </button>
        </div>
    </form>
</div>
{% endblock %}
